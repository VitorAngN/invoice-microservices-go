name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: ${{ matrix.service }} (vet, testes com -race, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [stock-service, invoice-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  frontend:
    name: frontend (build Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: build das imagens
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
