name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar site e documentação da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e renderizar a documentação (Redoc)
        run: |
          npx --yes @redocly/cli@latest lint docs/api/openapi.yaml --skip-rule=operation-operationId --skip-rule=info-license
          npx --yes @redocly/cli@latest build-docs docs/api/openapi.yaml -o _site/api/index.html --title "Faturamento em Microsserviços — API"
      - run: cp site/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
