services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-korp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-korp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  stock-service:
    build: ./stock-service
    environment:
      DATABASE_URL: host=db user=${POSTGRES_USER:-user} password=${POSTGRES_PASSWORD:-password} dbname=${POSTGRES_DB:-korp} port=5432 sslmode=disable TimeZone=America/Sao_Paulo
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  invoice-service:
    build: ./invoice-service
    environment:
      DATABASE_URL: host=db user=${POSTGRES_USER:-user} password=${POSTGRES_PASSWORD:-password} dbname=${POSTGRES_DB:-korp} port=5432 sslmode=disable TimeZone=America/Sao_Paulo
      STOCK_SERVICE_URL: http://stock-service:8081
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      stock-service:
        condition: service_started

volumes:
  pgdata:
